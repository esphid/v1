name: ESPHID
options:
  bundleIdPrefix: com.scalexy
  deploymentTarget:
    iOS: '17.0'
packages:
  ESPHIDKit:
    path: ESPHIDKit
settings:
  base:
    IOS_BUNDLE_ID: com.scalexy.esphid
    PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID)
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  ESPHID:
    type: application
    platform: iOS
    sources: [ESPHID/Sources, ESPHID/Resources]
    dependencies:
      - package: ESPHIDKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # CI's manual signing sets ESPHID_PROFILE_SPECIFIER so the profile applies to this
        # target only; a command-line PROVISIONING_PROFILE_SPECIFIER also reaches the
        # Swift package targets, which some Xcode versions reject.
        ESPHID_PROFILE_SPECIFIER: ''
        PROVISIONING_PROFILE_SPECIFIER: $(ESPHID_PROFILE_SPECIFIER)
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: build/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: ESPHID connects to your USB keyboard and mouse controller over Bluetooth.
        NSLocalNetworkUsageDescription: ESPHID discovers and controls devices on your local network.
        NSBonjourServices: [_esphid._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Explicit so App Store validation sees full iPad multitasking support.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ESPHIDTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ESPHIDKit/Tests/ESPHIDKitTests]
    dependencies:
      - target: ESPHID
      - package: ESPHIDKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(IOS_BUNDLE_ID).tests
schemes:
  ESPHID:
    build:
      targets:
        ESPHID: all
    test:
      targets: [ESPHIDTests]
