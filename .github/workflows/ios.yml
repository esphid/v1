# iOS: Swift package tests and a simulator build + tests on every branch push and PR.
# A published release also signs the app, uploads it to TestFlight and attaches the files.
#
# Signing secrets (organisation or repository level). Only the release-only `sign` job
# references them; branch and PR builds never see them.
#   APPLE_DEVELOPER_ACCOUNT_TEAM_ID
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID, _ISSUER_ID
#   APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY        .p8 contents (PEM text or base64)
#   APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64, _PASSWORD, _IDENTITY
#   APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_ESPHID_IOS_APP_STORE_BASE64
# Certificate + profile present: manual signing with them. API key only: Xcode
# cloud-managed signing (the key needs the Admin role). No API key: no signed build, and
# the run stays green.
# Variables: IOS_BUNDLE_ID (default com.scalexy.esphid), IOS_BUILD_NUMBER_OFFSET
# (nonnegative integer added to the run number), IOS_SUBMIT_FOR_REVIEW ('true' submits
# full releases, never pre-releases, for App Store review).
name: iOS
on:
  # Branch pushes only: a release's tag is built by the release event, not twice.
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Keyed by event so a branch build can never cancel a release build.
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.scalexy.esphid' }}
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUILD_OFFSET: ${{ vars.IOS_BUILD_NUMBER_OFFSET || '0' }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ.get('RELEASE_TAG', '')
          version = tag.removeprefix('v') if tag else '0.0.0'
          if not re.fullmatch(r'[A-Za-z0-9._+-]+', version):
              raise SystemExit(f'unsupported release tag {tag!r}')
          # App Store versions are 1-3 dot-separated integers: v1.2.0-rc.1 ships as 1.2.0.
          m = re.match(r'\d+(\.\d+){0,2}', version)
          if not m:
              raise SystemExit(f'release tag {tag!r} must start with a number, e.g. v1.2.0')
          build = int(os.environ['GITHUB_RUN_NUMBER']) + int(os.environ['BUILD_OFFSET'])
          out = {'release_version': version, 'marketing_version': m.group(0), 'build_number': build}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.writelines(f'{k}={v}\n' for k, v in out.items())
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.writelines(f'{k.upper()}={v}\n' for k, v in out.items())
          PY
      - name: Test Swift package
        working-directory: ios/ESPHIDKit
        run: swift test
      - name: Generate and build simulator app
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project ESPHID.xcodeproj -scheme ESPHID -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build build CODE_SIGNING_ALLOWED=NO IOS_BUNDLE_ID="$IOS_BUNDLE_ID" MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/ESPHID.app ESPHID-simulator.zip
      - name: Test app and library on iOS Simulator
        working-directory: ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild -project ESPHID.xcodeproj -scheme ESPHID -destination "platform=iOS Simulator,id=$DEVICE_ID" test CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v7
        with:
          name: ESPHID-simulator
          path: ios/ESPHID-simulator.zip
          if-no-files-found: error

  sign:
    # The only job that can read the Apple secrets, and it only runs for published releases.
    if: github.event_name == 'release'
    needs: build
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.scalexy.esphid' }}
      MARKETING_VERSION: ${{ needs.build.outputs.marketing_version }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
    steps:
      - name: Choose signing mode
        id: mode
        env:
          # Booleans only; no secret value reaches this step.
          HAVE_API_KEY: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_TEAM_ID != '' && secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID != '' && secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY != '' }}
          HAVE_CERT_AND_PROFILE: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD != '' && secrets.APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_ESPHID_IOS_APP_STORE_BASE64 != '' }}
        run: |
          if [ "$HAVE_API_KEY" != true ]; then
            mode=none
            echo 'App Store Connect API key secrets are not set: no signed iOS build.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAVE_CERT_AND_PROFILE" = true ]; then
            mode=manual
            echo 'Signing with the Apple Distribution certificate and the ESPHID App Store profile.' >> "$GITHUB_STEP_SUMMARY"
          else
            mode=automatic
            echo 'No ESPHID provisioning profile secret: using Xcode cloud-managed signing (needs an Admin API key).' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.mode.outputs.mode != 'none'
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.mode.outputs.mode != 'none'
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        if: steps.mode.outputs.mode != 'none'
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - uses: ruby/setup-ruby@v1
        if: steps.mode.outputs.mode != 'none'
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ios
      - name: Install signing material
        if: steps.mode.outputs.mode != 'none'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_TEAM_ID }}
          ASC_KEY: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY }}
          DIST_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          DIST_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_PROFILE_COM_SCALEXY_ESPHID_IOS_APP_STORE_BASE64 }}
        run: |
          set -euo pipefail
          # API key, used by xcodebuild (automatic mode) and fastlane (upload).
          python3 - <<'PY'
          import base64, os
          raw = os.environ['ASC_KEY'].strip()
          key = raw.encode() if raw.startswith('-----BEGIN') else base64.b64decode(raw)
          if b'PRIVATE KEY' not in key:
              raise SystemExit('APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY is neither a .p8 key nor base64 of one')
          fd = os.open(os.path.join(os.environ['RUNNER_TEMP'], 'AuthKey.p8'), os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, 'wb') as f:
              f.write(key)
          PY
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          [ "$MODE" = manual ] || exit 0

          # Distribution certificate in a throwaway keychain.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpass=$(openssl rand -hex 24)
          security create-keychain -p "$kpass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          (umask 077; printf '%s' "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12")
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$DIST_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpass" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          # App Store provisioning profile; refuse one made for a different app.
          profile="$RUNNER_TEMP/esphid.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid=$(plutil -extract UUID raw -o - "$RUNNER_TEMP/profile.plist")
          appid=$(plutil -extract Entitlements.application-identifier raw -o - "$RUNNER_TEMP/profile.plist")
          if [ "$appid" != "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]; then
            echo "::error::The provisioning profile is for $appid, not $APPLE_TEAM_ID.$IOS_BUNDLE_ID"
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
      - name: Archive and export
        if: steps.mode.outputs.mode != 'none'
        working-directory: ios
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID }}
          DIST_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APPLE_DISTRIBUTION_CERTIFICATE_IDENTITY }}
        run: |
          set -euo pipefail
          xcodegen generate
          common=(-project ESPHID.xcodeproj -scheme ESPHID -configuration Release -destination 'generic/platform=iOS'
            -archivePath build/ESPHID.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" IOS_BUNDLE_ID="$IOS_BUNDLE_ID"
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER")
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          if [ "$MODE" = manual ]; then
            identity="${DIST_IDENTITY:-Apple Distribution}"
            xcodebuild "${common[@]}" archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$identity" \
              ESPHID_PROFILE_SPECIFIER="$PROFILE_UUID" OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"
            export_auth=()
          else
            identity="Apple Distribution"
            xcodebuild "${common[@]}" archive "${auth[@]}" CODE_SIGN_STYLE=Automatic
            export_auth=("${auth[@]}")
          fi
          IDENTITY="$identity" python3 - <<'PY'
          import os, plistlib
          opts = {'method': 'app-store-connect', 'teamID': os.environ['APPLE_TEAM_ID'], 'manageAppVersionAndBuildNumber': False}
          if os.environ['MODE'] == 'manual':
              opts.update(signingStyle='manual', signingCertificate=os.environ['IDENTITY'],
                          provisioningProfiles={os.environ['IOS_BUNDLE_ID']: os.environ['PROFILE_UUID']})
          else:
              opts.update(signingStyle='automatic')
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as f:
              plistlib.dump(opts, f)
          PY
          xcodebuild -exportArchive -archivePath build/ESPHID.xcarchive -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export ${export_auth[@]+"${export_auth[@]}"}
      - name: Upload to TestFlight
        if: steps.mode.outputs.mode != 'none'
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_DEVELOPER_ACCOUNT_APP_STORE_CONNECT_ISSUER_ID }}
          # Pre-releases stop at TestFlight; only full releases may be submitted for review.
          IOS_SUBMIT_FOR_REVIEW: ${{ !github.event.release.prerelease && vars.IOS_SUBMIT_FOR_REVIEW || 'false' }}
        run: IPA_PATH="$PWD/build/export/ESPHID.ipa" bundle exec fastlane ios release
      - uses: actions/upload-artifact@v7
        if: steps.mode.outputs.mode != 'none'
        with:
          name: ios-ipa
          path: ios/build/export/ESPHID.ipa
          if-no-files-found: error
      - name: Remove signing material
        if: always() && steps.mode.outputs.mode != 'none'
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/esphid.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi

  release-assets:
    # Only this job can write to the repository; build steps never see a write token.
    # Runs even if signing failed, so the simulator build is still attached.
    if: github.event_name == 'release' && !cancelled() && needs.build.result == 'success'
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: downloaded
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir release
          cp downloaded/ESPHID-simulator/ESPHID-simulator.zip "release/esphid-ios-simulator-$RELEASE_VERSION.zip"
          if [ -f downloaded/ios-ipa/ESPHID.ipa ]; then
            cp downloaded/ios-ipa/ESPHID.ipa "release/esphid-ios-$RELEASE_VERSION.ipa"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
